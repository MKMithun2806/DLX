version: "3.9"

services:
  videodl:
    build: .
    image: video-downloader-webui:latest
    container_name: video-downloader-webui
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_PORT: 8080
      DB_PATH: /config/app.db
      DOWNLOADS_PATH: /downloads
      # Override with a long, random value in production - it encrypts
      # S3 secret keys and proxy credentials at rest in SQLite.
      APP_SECRET: ${APP_SECRET:-please-change-this-to-a-long-random-secret}
      YTDLP_PATH: /usr/local/bin/yt-dlp
    volumes:
      - ./data/config:/config
      - ./data/downloads:/downloads
    # Uncomment to allow outbound SOCKS5 proxies that rely on host
    # networking quirks (rarely needed):
    # network_mode: "host"
